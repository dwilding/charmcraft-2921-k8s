name: Check
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  UV_PYTHON: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Run lint
        run: uv run --frozen --only-group ci tox -e lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Run tests
        run: uv run --frozen --only-group ci tox -e unit

  integration:
    name: Integration Tests
    needs: [lint, unit]
    uses: $/.github/workflows/integration.yaml

  publish:
    name: Publish
    needs: [integration]
    # For publish.yaml
    secrets:
      CHARMHUB_TOKEN: ${{ secrets.CHARMHUB_TOKEN }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: $/.github/workflows/publish.yaml
